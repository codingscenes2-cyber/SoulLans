name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Fetch pinned Quaternius Universal Animation Library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/animations
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_1/UAL1_Standard.glb" -o assets/animations/UAL1_Standard.glb
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_1/LICENSE_Quaternius_CC0.txt" -o assets/animations/LICENSE_Quaternius_CC0.txt
          test "$(stat -c %s assets/animations/UAL1_Standard.glb)" -eq 7618436
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_2/UAL2_Standard.glb" -o assets/animations/UAL2_Standard.glb
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_2/LICENSE_Quaternius_CC0.txt" -o assets/animations/LICENSE_Quaternius_CC0_2.txt
          test "$(stat -c %s assets/animations/UAL2_Standard.glb)" -eq 8091444
      - name: Merge CC0 humanoid locomotion and combat animations
        run: |
          npm install --no-save @gltf-transform/core@4.2.1 @gltf-transform/extensions@4.2.1
          node tools/merge_animations.mjs assets/characters/ashen_hero.glb assets/characters/ashen_hero_animated.glb assets/animations/UAL1_Standard.glb assets/animations/UAL2_Standard.glb
      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit
      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 5
      - name: Run Quaternius animation asset test
        run: godot --headless --path . --script res://tests/animation_asset_tests.gd
      - name: Run rigged character asset smoke test
        run: godot --headless --path . --script res://tests/character_asset_tests.gd
      - name: Run rigged enemy animation tests
        run: godot --headless --path . --script res://tests/enemy_rig_tests.gd
      - name: Run Shield Guard combat regression tests
        run: godot --headless --path . --script res://tests/shield_guard_tests.gd
      - name: Run enemy attack arc regression tests
        run: godot --headless --path . --script res://tests/enemy_attack_arc_tests.gd
      - name: Run save-system regression tests
        run: godot --headless --path . --script res://tests/game_state_tests.gd
