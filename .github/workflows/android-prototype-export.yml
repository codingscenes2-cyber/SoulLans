name: Android debug prototype export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "export_presets.cfg"
      - "project.godot"
      - "scripts/main.gd"
      - "scripts/ashen_world_art.gd"
      - "assets/ASSET_CREDITS.md"
      - "assets/characters/**"
      - "scripts/player_controller.gd"
      - "tools/merge_animations.mjs"
      - "package.json"
      - "tests/character_asset_tests.gd"
      - ".github/workflows/android-prototype-export.yml"

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: ''

      - name: Install Godot 4.3 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Android export dependencies
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path was not provided by setup-android."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          sdkmanager --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest"

      - name: Restore persistent Android signing key
        shell: bash
        env:
          SOULLAND_KEYSTORE_BASE64: ${{ secrets.SOULLAND_KEYSTORE_BASE64 }}
          SOULLAND_KEYSTORE_PASSWORD: ${{ secrets.SOULLAND_KEYSTORE_PASSWORD }}
          SOULLAND_KEY_ALIAS: ${{ secrets.SOULLAND_KEY_ALIAS }}
          SOULLAND_KEY_PASSWORD: ${{ secrets.SOULLAND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SOULLAND_KEYSTORE_BASE64 SOULLAND_KEYSTORE_PASSWORD SOULLAND_KEY_ALIAS SOULLAND_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret $name. Refusing to create a random signing key."
              exit 1
            fi
          done
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          printf '%s' "$SOULLAND_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/soulland.keystore"
          keytool -list -keystore "$HOME/.android/soulland.keystore" -storepass "$SOULLAND_KEYSTORE_PASSWORD" -alias "$SOULLAND_KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/soulland.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$SOULLAND_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$SOULLAND_KEY_PASSWORD" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/adb = "$ANDROID_HOME/platform-tools/adb"
          export/android/debug_keystore = "$HOME/.android/soulland.keystore"
          export/android/debug_keystore_user = "$SOULLAND_KEY_ALIAS"
          export/android/debug_keystore_pass = "$SOULLAND_KEY_PASSWORD"
          EOF

      - name: Fetch CC0 PBR textures from Poly Haven
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/materials
          fetch_map() {
            local asset="$1" map="$2" output="$3"
            local files url
            files="$(curl -fsSL -H "User-Agent: SoulLandFallenRealm/0.3 (asset build)" "https://api.polyhaven.com/files/$asset")"
            url="$(printf '%s' "$files" | jq -r --arg suffix "_${map}_1k.jpg" '.. | objects | select(.url? and (.url | endswith($suffix))) | .url' | head -n1)"
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "Missing expected 1K map $asset $map"
              exit 1
            fi
            curl -fL --retry 3 "$url" -o "assets/materials/$output"
            test -s "assets/materials/$output"
          }
          for spec in "concrete_floor_01 concrete_floor_01" "rock_wall_17 rock_wall_17"; do
            read -r asset prefix <<< "$spec"
            fetch_map "$asset" diff "${prefix}_diff_1k.jpg"
            fetch_map "$asset" nor_gl "${prefix}_nor_gl_1k.jpg"
            fetch_map "$asset" rough "${prefix}_rough_1k.jpg"
          done
          du -h assets/materials/*

      - name: Fetch pinned Quaternius Universal Animation Library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/animations
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_1/UAL1_Standard.glb" -o assets/animations/UAL1_Standard.glb
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_1/LICENSE_Quaternius_CC0.txt" -o assets/animations/LICENSE_Quaternius_CC0.txt
          test "$(stat -c %s assets/animations/UAL1_Standard.glb)" -eq 7618436
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_2/UAL2_Standard.glb" -o assets/animations/UAL2_Standard.glb
          curl -fL --retry 3 "https://raw.githubusercontent.com/Barbatos6669/elderforge/bb2ce469f0ab2ccfc487faef55550ba07fae2483/assets/animations/universal_animation_library_2/LICENSE_Quaternius_CC0.txt" -o assets/animations/LICENSE_Quaternius_CC0_2.txt
          test "$(stat -c %s assets/animations/UAL2_Standard.glb)" -eq 8091444
      - name: Merge CC0 humanoid locomotion and combat animations
        run: |
          npm install --no-save @gltf-transform/core@4.2.1 @gltf-transform/extensions@4.2.1
          node tools/merge_animations.mjs assets/characters/ashen_hero.glb assets/characters/ashen_hero_animated.glb assets/animations/UAL1_Standard.glb assets/animations/UAL2_Standard.glb
      - name: Import project and export debug APK
        shell: bash
        run: |
          godot --headless --editor --path . --quit
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          godot --headless --verbose --path . --export-debug "Android" build/SOUL_LAND_FALLEN_REALM-debug.apk
          test -s build/SOUL_LAND_FALLEN_REALM-debug.apk
          sha256sum build/SOUL_LAND_FALLEN_REALM-debug.apk | tee build/SOUL_LAND_FALLEN_REALM-debug.apk.sha256
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/SOUL_LAND_FALLEN_REALM-debug.apk
          stat -c "APK size: %s bytes" build/SOUL_LAND_FALLEN_REALM-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOUL-LAND-FALLEN-REALM-android-debug
          path: |
            build/SOUL_LAND_FALLEN_REALM-debug.apk
            build/SOUL_LAND_FALLEN_REALM-debug.apk.sha256
          retention-days: 14
